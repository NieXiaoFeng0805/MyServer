<script>
(function () {
  function apply() {
    var b = document.body;
    if (!b) return;
    if (!b.classList.contains("hope-ui-dark")) {
      b.classList.remove("hope-ui-light");
      b.classList.add("hope-ui-dark");
    }
  }
  document.addEventListener("DOMContentLoaded", apply);
  setInterval(apply, 1200);
})();
</script>
